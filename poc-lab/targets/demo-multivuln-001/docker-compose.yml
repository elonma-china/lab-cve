services:
  target:
    build: .
    container_name: poclab-demo-multivuln-001-target
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 10
